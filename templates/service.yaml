apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: http
    port: {{ .Values.service.port }}
  selector:
    app.kubernetes.io/name: {{ .Values.appName }}
  type: {{ .Values.service.type }}  # Configurável (ex: ClusterIP ou LoadBalancer).